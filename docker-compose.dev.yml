name: miauflix-dev

services:
  bunqueue:
    image: ghcr.io/egeominotti/bunqueue:2.8.61
    volumes:
      - bunqueue_data:/app/data
    ports:
      - '127.0.0.1:6790:6790'

  media-catalog:
    build:
      context: .
      dockerfile: services/media-catalog/Dockerfile
      target: development
    environment:
      DATA_DIR: /app/data
      BUNQUEUE_HOST: bunqueue
      BUNQUEUE_PORT: '6789'
      DEBUG: '*'
    ports:
      - '127.0.0.1:3001:3001'
    volumes:
      # Hot reload: sources are bind-mounted (bun runs TypeScript directly)
      - ./services/media-catalog/src:/workspace/services/media-catalog/src
      - ./data:/app/data

  list-service:
    build:
      context: .
      dockerfile: services/list-service/Dockerfile
      target: development
    environment:
      LIST_SERVICE_DATA_DIR: /app/data
      LIST_SERVICE_PORT: '3002'
      TRAKT_API_URL: ${TRAKT_API_URL:-https://api.trakt.tv}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-}
      LIST_SERVICE_ENCRYPTION_KEY: ${LIST_SERVICE_ENCRYPTION_KEY:-}
    ports:
      - '127.0.0.1:3002:3002'
    volumes:
      - ./services/list-service/src:/workspace/services/list-service/src
      - ./data/list-service:/app/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm --workspace backend run dev
    environment:
      DATA_DIR: /usr/data
      NODE_ENV: development
      PORT: 3000
      DISABLE_VPN_CHECK: 'true'
      ENABLE_FLARESOLVERR: 'false'
      ENABLE_FRONTEND: 'false'
      COOKIE_DOMAIN: localhost
      # The frontend is served over Vite HTTPS, so auth cookies must be Secure.
      COOKIE_SECURE: 'true'
      ALLOW_CREATE_ADMIN_ON_FIRST_RUN: ${ALLOW_CREATE_ADMIN_ON_FIRST_RUN:-false}
      BUNQUEUE_HOST: bunqueue
      BUNQUEUE_PORT: '6789'
      CATALOG_SERVICE_URL: http://media-catalog:3001
      LIST_SERVICE_URL: http://list-service:3002
    depends_on:
      bunqueue:
        condition: service_healthy
      media-catalog:
        condition: service_started
      list-service:
        condition: service_started
    ports:
      - '127.0.0.1:5000:3000'
    volumes:
      - ./.env:/usr/src/app/.env
      # Keep generated backend client files from the image available to Vite.
      - ./backend/src:/usr/src/app/backend/src
      - ./backend/loader.js:/usr/src/app/backend/loader.js:ro
      - ./backend/package.json:/usr/src/app/backend/package.json:ro
      - ./backend/tsconfig.json:/usr/src/app/backend/tsconfig.json:ro
      - ./backend/tsconfig.app.json:/usr/src/app/backend/tsconfig.app.json:ro
      - ./backend/tsconfig.client.json:/usr/src/app/backend/tsconfig.client.json:ro
      - ./data:/usr/data
      - ${DOWNLOADS_HOST_PATH:-./downloads}:/usr/src/app/downloads

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm --workspace frontend run dev -- --host 0.0.0.0
    environment:
      BACKEND_URL: http://backend:3000
      VITE_API_URL: /
      # Docker Desktop bind mounts can miss filesystem events without polling.
      CHOKIDAR_USEPOLLING: 'true'
    depends_on:
      - backend
    ports:
      - '127.0.0.1:4173:4173'
    volumes:
      - ./.env:/usr/src/app/.env:ro
      - ./frontend:/usr/src/app/frontend

volumes:
  bunqueue_data:
