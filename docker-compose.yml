services:
  bunqueue:
    image: ghcr.io/egeominotti/bunqueue:2.8.61
    network_mode: service:vpn
    depends_on:
      - vpn
    volumes:
      - bunqueue_data:/app/data
    restart: unless-stopped

  vpn:
    image: ghcr.io/bubuntux/nordlynx
    hostname: nordvpn
    container_name: nordvpn
    env_file:
      - path: .env
        required: false
    cap_add:
      - NET_ADMIN # Required
      - SYS_MODULE # Maybe required
    environment:
      - PRIVATE_KEY=$NORDVPN_PRIVATE_KEY # Using token from .env file
      - CONNECT=United_States # Optional - Change to your preferred server location
      - NET_LOCAL=192.168.0.0/16 # Optional - Your local network
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1 # Maybe required
      - net.ipv4.conf.all.rp_filter=2 # Set reverse path filter to loose mode
      - net.ipv6.conf.all.disable_ipv6=1 # Disable IPv6; recommended for IPv4 only
    ports:
      - '127.0.0.1:5000:3000' # Expose backend API port locally only
      - '127.0.0.1:16686:16686' # Expose Jaeger UI port locally only
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: miauflix-jaeger
    network_mode: service:vpn # Route traffic through NordVPN
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: miauflix-flaresolverr
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-UTC}
    network_mode: service:vpn # Route traffic through NordVPN
    volumes:
      - flaresolver_config:/config
    restart: unless-stopped

  media-catalog:
    build:
      context: .
      dockerfile: services/media-catalog/Dockerfile
    image: miauflix-media-catalog
    container_name: miauflix-media-catalog
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - DATA_DIR=/app/data
      - CATALOG_CONFIG_FILE=/shared/config.json
      - CATALOG_SERVICE_ENCRYPTION_KEY=${CATALOG_SERVICE_ENCRYPTION_KEY:-}
      - BUNQUEUE_HOST=127.0.0.1
      - BUNQUEUE_PORT=6789
      - TMDB_API_ACCESS_TOKEN=${TMDB_API_ACCESS_TOKEN:-}
      - CATALOG_DISABLE_BACKGROUND_TASKS=${CATALOG_DISABLE_BACKGROUND_TASKS:-false}
    volumes:
      - ./data:/app/data/
      - ./data:/shared
    network_mode: service:vpn # Reach the catalog provider through NordVPN
    restart: unless-stopped

  list-service:
    build:
      context: .
      dockerfile: services/list-service/Dockerfile
    image: miauflix-list-service
    container_name: miauflix-list-service
    depends_on:
      vpn:
        condition: service_healthy
    environment:
      - LIST_SERVICE_DATA_DIR=/app/data
      - LIST_SERVICE_CONFIG_FILE=/shared/config.json
      - LIST_SERVICE_PORT=3002
      - LIST_SERVICE_ENCRYPTION_KEY=${LIST_SERVICE_ENCRYPTION_KEY:-}
      - TRAKT_API_URL=${TRAKT_API_URL:-https://api.trakt.tv}
      - TRAKT_CLIENT_ID=${TRAKT_CLIENT_ID:-}
      - TRAKT_CLIENT_SECRET=${TRAKT_CLIENT_SECRET:-}
      - TRAKT_REDIRECT_URI=${TRAKT_REDIRECT_URI:-}
    volumes:
      - ./data/list-service:/app/data
      - ./data:/shared
    network_mode: service:vpn
    restart: unless-stopped

  miauflix:
    build:
      context: .
      dockerfile: Dockerfile
    image: miauflix
    container_name: miauflix
    depends_on:
      vpn:
        condition: service_healthy
      bunqueue:
        condition: service_healthy
      flaresolverr:
        condition: service_started
      jaeger:
        condition: service_started
      media-catalog:
        condition: service_started
      list-service:
        condition: service_started
    environment:
      - DATA_DIR=/usr/data
      - PUID=${USER_ID:-1000}
      - PGID=${GROUP_ID:-1000}
      - DISABLE_VPN_CHECK=true
      - ALLOW_CREATE_ADMIN_ON_FIRST_RUN=${ALLOW_CREATE_ADMIN_ON_FIRST_RUN:-false}
      - COOKIE_DOMAIN=${DOMAIN}
      - COOKIE_SECURE=true
      - ENABLE_TRACING=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
      - ENABLE_FRONTEND=false # Frontend is served by nginx
      - DEBUG=SourceService,DataResolver,DownloadService
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://localhost:8191}
      - ENABLE_FLARESOLVERR=${ENABLE_FLARESOLVERR:-true}
      - BUNQUEUE_HOST=127.0.0.1
      - BUNQUEUE_PORT=6789
      - CATALOG_SERVICE_URL=http://localhost:3001 # Same network namespace as media-catalog
      - LIST_SERVICE_URL=http://localhost:3002 # Same network namespace as list-service
    healthcheck:
      test: ['CMD', 'curl', '-f', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 2s
      retries: 3
      start_period: 10s
    volumes:
      - ./.env:/usr/src/app/.env
      - ./data:/usr/data/
      - ./traces:/tmp:rw
      - ${DOWNLOADS_HOST_PATH:-./downloads}:/usr/src/app/downloads
      - frontend_static:/usr/src/app/public_volume
    network_mode: service:vpn # Route traffic through NordVPN
    # No ports section here as they're defined in the nordvpn service
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: miauflix-nginx
    ports:
      - '80:80' # Expose HTTP port
      - '443:443' # Expose HTTPS port
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - frontend_static:/usr/share/nginx/html:ro
    env_file:
      - path: .env
        required: false
    environment:
      - REVERSE_PROXY_SECRET=${REVERSE_PROXY_SECRET}
      - DOMAIN=${DOMAIN}
      - WWW_DOMAIN=${WWW_DOMAIN}
      - SSL_CERTIFICATE=${SSL_CERTIFICATE}
      - SSL_CERTIFICATE_KEY=${SSL_CERTIFICATE_KEY}
      - SSL_DHPARAM=${SSL_DHPARAM}
    depends_on:
      - miauflix
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: miauflix-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  bunqueue_data:
  frontend_static:
    name: frontend_static
  flaresolver_config:
    name: flaresolver_config
