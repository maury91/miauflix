# Miauflix: prebuilt images, set up from the browser.
# Usage: docker compose up -d, then open http://localhost:3000
# Guide: docs/setup/docker-setup.md#prebuilt-images
#
# This is the base of every deployment. Add features by listing more files in COMPOSE_FILE (in a
# .env file next to the compose files; on Windows separate them with ; instead of :), any order:
#   docker-compose.vpn.yml           route everything through NordVPN (gluetun)
#   docker-compose.https.yml         HTTPS for a domain with Caddy
#   docker-compose.flaresolverr.yml  FlareSolverr for Cloudflare-protected sources
#   docker-compose.tracing.yml       OpenTelemetry tracing to Jaeger
#   docker-compose.build.yml         build the images from a clone of the repository
# e.g. COMPOSE_FILE=docker-compose.yml:docker-compose.vpn.yml:docker-compose.https.yml

services:
  miauflix:
    image: ghcr.io/${MIAUFLIX_IMAGE_NAMESPACE:-maury91}/miauflix:${MIAUFLIX_VERSION:-latest}
    ports:
      # Only this computer can connect until you open it to your network (MIAUFLIX_LISTEN_ADDRESS), see
      # docs/setup/docker-setup.md#open-it-to-your-local-network
      - '${MIAUFLIX_LISTEN_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      DATA_DIR: /usr/src/app/data
      DOWNLOAD_PATH: /usr/src/app/downloads
      BUNQUEUE_HOST: miauflix-services
      BUNQUEUE_PORT: 6789
      CATALOG_SERVICE_URL: http://miauflix-services:3001
      LIST_SERVICE_URL: http://miauflix-services:3002
      ALLOW_CREATE_ADMIN_ON_FIRST_RUN: ${ALLOW_CREATE_ADMIN_ON_FIRST_RUN:-true} # create the admin from the browser
      # Without a VPN, Miauflix refuses to search for sources: torrents would go out from your real IP.
      # Add docker-compose.vpn.yml (strongly recommended, required on anything internet-facing), see
      # docs/setup/docker-setup.md#using-a-vpn. To accept the risk and run without one, put
      # DISABLE_VPN_CHECK=true in a .env file next to this file.
      DISABLE_VPN_CHECK: ${DISABLE_VPN_CHECK:-false}
      # Only used once docker-compose.flaresolverr.yml / docker-compose.tracing.yml turn them on;
      # docker-compose.vpn.yml points them at 127.0.0.1, since they then share the VPN's network.
      FLARESOLVERR_URL: http://flaresolverr:8191
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      DEBUG: ${DEBUG:-}
    volumes:
      - miauflix_data:/usr/src/app/data
      - ${DOWNLOADS_HOST_PATH:-./downloads}:/usr/src/app/downloads
    depends_on:
      miauflix-services:
        condition: service_healthy
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'
      autoheal: 'true'

  # Bunqueue, media catalog and list service in one container.
  miauflix-services:
    image: ghcr.io/${MIAUFLIX_IMAGE_NAMESPACE:-maury91}/miauflix-services:${MIAUFLIX_VERSION:-latest}
    init: true
    environment:
      LIST_SERVICE_ENCRYPTION_KEY: ${LIST_SERVICE_ENCRYPTION_KEY:-}
      CATALOG_DISABLE_BACKGROUND_TASKS: ${CATALOG_DISABLE_BACKGROUND_TASKS:-false}
    volumes:
      - miauflix_services_data:/app/data
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: 'true'

  # Off until docker-compose.flaresolverr.yml turns it on. Defined here so that
  # docker-compose.vpn.yml can move it into the VPN's network whatever the file order.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: [flaresolverr]
    environment:
      LOG_LEVEL: info
      LOG_HTML: 'false'
      CAPTCHA_SOLVER: none
      TZ: ${TZ:-UTC}
    volumes:
      - flaresolverr_config:/config
    restart: unless-stopped

  # Off until docker-compose.tracing.yml turns it on, see flaresolverr above.
  jaeger:
    image: jaegertracing/all-in-one:latest
    profiles: [tracing]
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '127.0.0.1:16686:16686' # Jaeger UI, this computer only
    restart: unless-stopped

  # Docker only marks a container unhealthy, it never restarts it (restart: only covers exits).
  # autoheal restarts the containers labelled autoheal=true once their healthcheck fails.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      AUTOHEAL_INTERVAL: 30
    network_mode: none # Talks to Docker through the socket only
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # Updates the Miauflix containers (labelled com.centurylinklabs.watchtower.enable=true) when a
  # new image is published, by default every day at 4:00 (WATCHTOWER_SCHEDULE: seconds first, TZ).
  # Fork of containrrr/watchtower, which is archived and no longer works with current Docker.
  watchtower:
    image: nickfedor/watchtower:1
    environment:
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE:-0 0 4 * * *}
      WATCHTOWER_CLEANUP: 'true' # Remove the replaced images
      WATCHTOWER_TIMEOUT: 30s # Time to shut down gracefully before being killed
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  miauflix_data:
  miauflix_services_data:
  flaresolverr_config:
