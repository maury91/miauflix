services:
  bunqueue:
    image: ghcr.io/egeominotti/bunqueue:2.8.61
    network_mode: service:nordvpn
    depends_on:
      - nordvpn
    volumes:
      - bunqueue_data:/app/data
    restart: unless-stopped

  nordvpn:
    image: qmcgaw/gluetun:v3
    hostname: nordvpn
    container_name: nordvpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${NORDVPN_PRIVATE_KEY:-} # From .env, see docs/setup/docker-setup.md#using-a-vpn
      - SERVER_CATEGORIES=P2P
      - SERVER_COUNTRIES=${NORDVPN_COUNTRIES:-United States} # Comma-separated, change to your preferred locations
    restart: unless-stopped

  media-catalog:
    image: ghcr.io/${MIAUFLIX_IMAGE_NAMESPACE:-maury91}/miauflix-media-catalog:${MIAUFLIX_VERSION:-latest}
    container_name: miauflix-media-catalog
    depends_on:
      nordvpn:
        condition: service_started
    environment:
      - DATA_DIR=/app/data
      - BUNQUEUE_HOST=127.0.0.1
      - BUNQUEUE_PORT=6789
      - CATALOG_DISABLE_BACKGROUND_TASKS=${CATALOG_DISABLE_BACKGROUND_TASKS:-false}
    volumes:
      - ./data/media-catalog:/app/data
    network_mode: service:nordvpn # Reach the catalog provider through NordVPN
    restart: unless-stopped

  list-service:
    image: ghcr.io/${MIAUFLIX_IMAGE_NAMESPACE:-maury91}/miauflix-list-service:${MIAUFLIX_VERSION:-latest}
    container_name: miauflix-list-service
    depends_on:
      nordvpn:
        condition: service_started
    environment:
      - LIST_SERVICE_DATA_DIR=/app/data
      - LIST_SERVICE_ENCRYPTION_KEY=${LIST_SERVICE_ENCRYPTION_KEY:-}
    volumes:
      - ./data/list-service:/app/data
    network_mode: service:nordvpn
    restart: unless-stopped

  backend:
    image: ghcr.io/${MIAUFLIX_IMAGE_NAMESPACE:-maury91}/miauflix:${MIAUFLIX_VERSION:-latest}
    container_name: miauflix-backend
    depends_on:
      nordvpn:
        condition: service_started
      bunqueue:
        condition: service_healthy
      media-catalog:
        condition: service_started
      list-service:
        condition: service_started
    environment:
      - DATA_DIR=/usr/data
      - DEBUG=SourceService,App,MovieSync,ListService,Cache,MagnetService
      - BUNQUEUE_HOST=127.0.0.1
      - BUNQUEUE_PORT=6789
      - CATALOG_SERVICE_URL=http://localhost:3001 # Same network namespace as media-catalog
      - LIST_SERVICE_URL=http://localhost:3002 # Same network namespace as list-service
    volumes:
      - ./data:/usr/data/
    network_mode: service:nordvpn # Route traffic through NordVPN
    # No ports section here as they're defined in the nordvpn service
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: miauflix-nginx
    ports:
      - '80:80' # Expose HTTP port
      - '443:443' # Expose HTTPS port
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/templates:/etc/nginx/templates
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    env_file: .env
    environment:
      - REVERSE_PROXY_SECRET=${REVERSE_PROXY_SECRET}
      - DOMAIN=${DOMAIN}
      - WWW_DOMAIN=${WWW_DOMAIN}
      - SSL_CERTIFICATE=${SSL_CERTIFICATE}
      - SSL_CERTIFICATE_KEY=${SSL_CERTIFICATE_KEY}
      - SSL_DHPARAM=${SSL_DHPARAM}
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: miauflix-certbot
    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  bunqueue_data:
