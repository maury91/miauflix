# Run every Miauwatch service in one container (miauwatch-services) instead of three, to save memory
# and processes. Usage: add it to COMPOSE_FILE in .env, e.g.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.all-in-one.yml
# Guide: docs/setup/docker-setup.md#one-container-for-all-services
#
# Without the VPN only: source search and media load would leave the VPN too. With
# docker-compose.vpn.yml, keep the separate containers. Uses the same data volume as them, so you
# can switch back and forth.

services:
  miauwatch:
    environment:
      BUNQUEUE_HOST: miauwatch-services
      CATALOG_SERVICE_URL: http://miauwatch-services:3001
      LIST_SERVICE_URL: http://miauwatch-services:3002
      SOURCES_SERVICE_URL: http://miauwatch-services:3003
      MEDIA_LOAD_SERVICE_URL: http://miauwatch-services:3004
    depends_on: !reset
      miauwatch-services:
        condition: service_healthy

  miauwatch-services:
    profiles: !reset [] # Defined, but off, in docker-compose.yml

  # Replaced by miauwatch-services
  miauwatch-catalog-services:
    profiles: [split]
  miauwatch-sources:
    profiles: [split]
  miauwatch-media-load:
    profiles: [split]
