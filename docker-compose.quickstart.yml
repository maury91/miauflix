# Miauflix quick start: prebuilt images, set up from the browser.
# Usage: docker compose -f docker-compose.quickstart.yml up -d, then open http://localhost:3000
# Guide: docs/setup/docker-setup.md#prebuilt-images

services:
  miauflix:
    image: ghcr.io/maury91/miauflix:latest
    ports:
      # Only this computer can connect until you open it to your network, see
      # docs/setup/docker-setup.md#open-it-to-your-local-network
      - '127.0.0.1:3000:3000'
    environment:
      DATA_DIR: /usr/src/app/data
      DOWNLOAD_PATH: /usr/src/app/downloads
      BUNQUEUE_HOST: miauflix-services
      BUNQUEUE_PORT: 6789
      CATALOG_SERVICE_URL: http://miauflix-services:3001
      LIST_SERVICE_URL: http://miauflix-services:3002
      ALLOW_CREATE_ADMIN_ON_FIRST_RUN: 'true' # create the admin from the browser
      DISABLE_VPN_CHECK: 'true' # remove when routing through a VPN, see docs/setup/docker-setup.md#using-a-vpn
    volumes:
      - miauflix_data:/usr/src/app/data
      - ./downloads:/usr/src/app/downloads
    depends_on:
      miauflix-services:
        condition: service_healthy
    restart: unless-stopped

  miauflix-services:
    image: ghcr.io/maury91/miauflix-services:latest
    init: true
    volumes:
      - miauflix_services_data:/app/data
    restart: unless-stopped

volumes:
  miauflix_data:
  miauflix_services_data:
