# Route source search and torrents through NordVPN with gluetun (https://github.com/qdm12/gluetun).
# Usage: put these in a .env file next to the compose files, then run docker compose up -d
#   COMPOSE_FILE=docker-compose.yml:docker-compose.vpn.yml
#   NORDVPN_PRIVATE_KEY=<your NordLynx key, scripts/nordvpn-key.sh writes it for you>
#   NORDVPN_COUNTRIES=<optional, comma-separated, e.g. Switzerland,Netherlands>
# Guide: docs/setup/docker-setup.md#using-a-vpn
#
# Only what talks to indexers, trackers and peers runs inside the VPN: miauflix-sources,
# miauflix-media-load and FlareSolverr. Gluetun owns their network and its firewall drops all
# traffic outside the tunnel, so it doubles as a kill switch: if the VPN goes down, nothing leaks
# from your real IP. The backend and the catalog services (TMDB, Trakt) stay on the normal network
# and reach the two through the vpn container.

services:
  vpn:
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${NORDVPN_PRIVATE_KEY:?Set NORDVPN_PRIVATE_KEY in .env, see docs/setup/docker-setup.md#using-a-vpn}
      SERVER_CATEGORIES: P2P
      SERVER_COUNTRIES: ${NORDVPN_COUNTRIES:-}
    restart: unless-stopped

  miauflix:
    environment:
      # These two share the VPN container's network, so they answer at its address.
      SOURCES_SERVICE_URL: http://vpn:3003
      MEDIA_LOAD_SERVICE_URL: http://vpn:3004
      # Source search reaches FlareSolverr inside the VPN's network.
      FLARESOLVERR_URL: http://127.0.0.1:8191
      DISABLE_VPN_CHECK: 'false'

  miauflix-sources:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

  miauflix-media-load:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy

  # Only started with docker-compose.flaresolverr.yml
  flaresolverr:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
