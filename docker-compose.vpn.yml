# Route the prebuilt-image quick start through NordVPN with gluetun (https://github.com/qdm12/gluetun).
# Usage: put these in a .env file next to the compose files, then run docker compose up -d
#   COMPOSE_FILE=docker-compose.quickstart.yml:docker-compose.vpn.yml
#   NORDVPN_PRIVATE_KEY=<your NordLynx key, scripts/nordvpn-key.sh writes it for you>
#   NORDVPN_COUNTRIES=<optional, comma-separated, e.g. Switzerland,Netherlands>
# Guide: docs/setup/docker-setup.md#using-a-vpn
#
# Gluetun owns the network of every service below and its firewall drops all traffic outside
# the tunnel, so it doubles as a kill switch: if the VPN goes down, nothing leaks from your real IP.

services:
  vpn:
    image: qmcgaw/gluetun:v3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: wireguard
      WIREGUARD_PRIVATE_KEY: ${NORDVPN_PRIVATE_KEY:?Set NORDVPN_PRIVATE_KEY in .env, see docs/setup/docker-setup.md#using-a-vpn}
      SERVER_CATEGORIES: P2P
      SERVER_COUNTRIES: ${NORDVPN_COUNTRIES:-}
    ports:
      # The services share the VPN container's network, so their port is published here.
      # See docs/setup/docker-setup.md#open-it-to-your-local-network
      - '127.0.0.1:3000:3000'
    restart: unless-stopped

  miauflix:
    network_mode: service:vpn
    ports: !reset []
    environment:
      BUNQUEUE_HOST: 127.0.0.1
      CATALOG_SERVICE_URL: http://127.0.0.1:3001
      LIST_SERVICE_URL: http://127.0.0.1:3002
      DISABLE_VPN_CHECK: 'false'
    depends_on:
      vpn:
        condition: service_healthy

  miauflix-services:
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
