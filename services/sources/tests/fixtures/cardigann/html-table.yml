id: htmltable
name: HTML Table
language: en-US
type: public
links:
  - https://table.invalid/
caps:
  categorymappings:
    - { id: tv, cat: TV, desc: TV }
    - { id: anime, cat: TV/Anime, desc: Anime }
  modes:
    search: [q]
    tv-search: [q, season, ep]
search:
  paths:
    - path: /search/{{ .Keywords }}
  rows:
    selector: table.results tr.row
  fields:
    title:
      selector: td.name a
    magnet:
      selector: a.magnet
      attribute: href
    download:
      selector: a.torrent
      attribute: href
      optional: true
    size:
      selector: td.size
    seeders:
      selector: td.seeds
    leechers:
      selector: td.leech
      optional: true
    date:
      selector: td.age
      filters:
        - name: timeago
    category:
      text: tv
    comment:
      selector: td.name span.badge
      optional: true
