services:
  backend:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-backend
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-backend

  miauflix-catalog-services:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-miauflix-catalog-services
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-miauflix-catalog-services

  miauflix-video-services:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-miauflix-video-services
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-miauflix-video-services

  tmdb-images:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-tmdb-images
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-tmdb-images

  tmdb-mock:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-tmdb-mock
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-tmdb-mock

  trakt-mock:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-trakt-mock
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-trakt-mock

  indexer-mock:
    build:
      cache_from:
        - type=gha,scope=miauflix-e2e-indexer-mock
      cache_to:
        - type=gha,mode=max,scope=miauflix-e2e-indexer-mock
