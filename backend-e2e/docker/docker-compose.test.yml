services:
  # Backend service
  backend:
    image: miauflix-e2e-backend:${E2E_IMAGE_TAG:-local}
    build:
      context: ../../
      dockerfile: Dockerfile
    environment:
      - PUID=${USER_ID:-1000}
      - PGID=${GROUP_ID:-1000}
      - PORT=3000
      - NODE_ENV=test
      - RATE_LIMIT_TEST_MODE=true
      - ALLOW_CREATE_ADMIN_ON_FIRST_RUN=${ALLOW_CREATE_ADMIN_ON_FIRST_RUN:-false}
      - BUNQUEUE_HOST=miauflix-services
      - BUNQUEUE_PORT=6789
      - CATALOG_SERVICE_URL=http://miauflix-services:3001
      - LIST_SERVICE_URL=http://miauflix-services:3002
      - TMDB_API_URL=http://tmdb-mock/3
      # The initial-setup lane overrides E2E_CATALOG_TMDB_TOKEN with an empty
      # value so the browser must complete Catalog configuration through the UI.
      - TMDB_API_ACCESS_TOKEN=${E2E_CATALOG_TMDB_TOKEN-e2e-dummy-token}
      - TRAKT_API_URL=http://trakt-mock
      - TRAKT_CLIENT_ID=${E2E_TRAKT_CLIENT_ID-${TRAKT_CLIENT_ID:-mock-trakt-client-id}}
      - TRAKT_CLIENT_SECRET=${E2E_TRAKT_CLIENT_SECRET-${TRAKT_CLIENT_SECRET:-mock-trakt-client-secret}}
      - TRAKT_REDIRECT_URI=${E2E_TRAKT_REDIRECT_URI-${TRAKT_REDIRECT_URI:-https://app.example/trakt/callback}}
      - YTS_API_URL=http://yts-mock
      - THE_RARBG_API_URL=http://therarbg-mock
      - DISABLE_VPN_CHECK=true
      - DISABLE_DISCOVERY=true
      - STATIC_TRACKERS=udp://tracker-mock:6969/announce
      - SCRAPE_TRACKERS=udp://tracker-mock:6969/announce
      - BEST_TRACKERS_DOWNLOAD_URL=http://tracker-mock:8080/trackers_best.txt
      - BLACKLISTED_TRACKERS_DOWNLOAD_URL=http://tracker-mock:8080/blacklist.txt
      - DOWNLOAD_PATH=/usr/src/app/downloads
      - DEBUG=*,-require-in-the-middle
      - DISABLE_BACKGROUND_TASKS=${DISABLE_BACKGROUND_TASKS:-true}
      - ENABLE_TRACING=true
    networks:
      - test-network
    ports:
      - '${PORT}:3000'
    volumes:
      - ../.env.test:/usr/src/app/.env
      - test_downloads:/usr/src/app/downloads
      - ../logs/traces:/tmp:rw
    healthcheck:
      test: ['CMD', 'curl', '-f', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      miauflix-services:
        condition: service_healthy
      tmdb-mock:
        condition: service_healthy
      yts-mock:
        condition: service_healthy
      trakt-mock:
        condition: service_healthy
      therarbg-mock:
        condition: service_healthy
      tracker-mock:
        condition: service_healthy

  # Bunqueue, media catalog, and list service share one runtime image while
  # retaining their own ports and data directories.
  miauflix-services:
    image: miauflix-e2e-miauflix-services:${E2E_IMAGE_TAG:-local}
    build:
      context: ../../
      dockerfile: backend-e2e/docker/miauflix-services.Dockerfile
    init: true
    environment:
      - TCP_PORT=6789
      - HTTP_PORT=6790
      - DATA_PATH=/app/data/bunqueue/bunqueue.db
      - BUNQUEUE_HOST=127.0.0.1
      - BUNQUEUE_PORT=6789
      - CATALOG_DATA_DIR=/app/data/catalog
      - CATALOG_DISABLE_BACKGROUND_TASKS=${CATALOG_DISABLE_BACKGROUND_TASKS:-true}
      - LIST_SERVICE_PORT=3002
      - LIST_SERVICE_DATA_DIR=/app/data/list-service
      - BACKDROP_FOCUS_MODEL_DIR=/app/models
      - BACKDROP_FOCUS_WASM_DIR=/app/wasm
      - DEBUG=*
    volumes:
      - test_bunqueue_data:/app/data/bunqueue
      - list_service_data:/app/data/list-service
    expose:
      - '3001'
      - '3002'
      - '6789'
      - '6790'
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "await Promise.all(['http://127.0.0.1:3001/health','http://127.0.0.1:3002/health','http://127.0.0.1:6790/health'].map(async url => { const response = await fetch(url); if (!response.ok) throw new Error(url + ' returned ' + response.status) }))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      tmdb-mock:
        condition: service_healthy
      trakt-mock:
        condition: service_healthy

  # TMDB Image Mock Service
  tmdb-images:
    image: miauflix-e2e-tmdb-images:${E2E_IMAGE_TAG:-local}
    build:
      context: mock
      dockerfile: tmdb-images.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - ASSET_DIR=/app/data/images
      - IMAGE_PROXY_BASE_URL=https://image.tmdb.org/t/p/
    ports:
      - '${TMDB_IMAGE_PORT:-3001}:80'
    volumes:
      - ../../test-fixtures/providers/tmdb:/app/data:ro
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 5s

  # TMDB API Mock Service
  tmdb-mock:
    image: miauflix-e2e-tmdb-mock:${E2E_IMAGE_TAG:-local}
    build:
      context: mock
      dockerfile: tmdb.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.themoviedb.org/3
      - API_AUTH_HEADER_IS_BEARER=true
      - API_KEY=${TMDB_API_ACCESS_TOKEN:-e2e-dummy-token}
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - IMAGE_BASE_URL=http://127.0.0.1:${TMDB_IMAGE_PORT:-3001}/t/p/
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/tmdb:/app/data
    networks:
      - test-network
    depends_on:
      tmdb-images:
        condition: service_healthy

  # Trakt Mock Service
  trakt-mock:
    image: miauflix-e2e-trakt-mock:${E2E_IMAGE_TAG:-local}
    build:
      context: mock
      dockerfile: mock.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.trakt.tv
      - API_AUTH_HEADER=trakt-api-key
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=$TRAKT_CLIENT_ID
      - API_SECRET=$TRAKT_CLIENT_SECRET
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - |
        API_HEADERS={"trakt-api-version": "2"}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/trakt:/app/data
    networks:
      - test-network

  # YTS Mock Service
  yts-mock:
    image: miauflix-e2e-yts-mock:${E2E_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: mock/yts.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://yts.mx/api/v2
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=none
      - OWN_URL=http://yts-mock
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./yts/data:/app/data
    networks:
      - test-network

  # TheRARBG Mock Service
  therarbg-mock:
    image: miauflix-e2e-therarbg-mock:${E2E_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: mock/therarbg.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://therarbg.to
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=none
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./therarbg/data:/app/data
    networks:
      - test-network

  # Local HTTP tracker lists and UDP scrape responses keep torrent setup offline.
  tracker-mock:
    image: node:22-alpine
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: ['node', '/app/index.js']
    volumes:
      - ./mock/tracker/index.js:/app/index.js:ro
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  test-network:
    driver: bridge

volumes:
  test_bunqueue_data:
    name: miauflix_test_bunqueue_data
  test_downloads:
    name: miauflix_test_downloads
  list_service_data:
    name: miauflix_test_list_service_data
