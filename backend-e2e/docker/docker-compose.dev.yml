services:
  # Bunqueue broker for backend schedule coordination and background jobs
  bunqueue:
    image: ghcr.io/egeominotti/bunqueue:2.8.61
    volumes:
      - dev_bunqueue_data:/app/data
    networks:
      - test-network

  # Backend service with hot reloading for development
  backend:
    build:
      context: ../../
      dockerfile: backend-e2e/docker/backend.dev.Dockerfile
    environment:
      - PUID=${USER_ID:-1001}
      - PGID=${GROUP_ID:-1001}
      - PORT=3000
      - NODE_ENV=development
      - RATE_LIMIT_TEST_MODE=true
      - ALLOW_CREATE_ADMIN_ON_FIRST_RUN=${ALLOW_CREATE_ADMIN_ON_FIRST_RUN:-false}
      - BUNQUEUE_HOST=bunqueue
      - BUNQUEUE_PORT=6789
      - CATALOG_SERVICE_URL=http://media-catalog:3001
      - LIST_SERVICE_URL=http://list-service:3002
      - SOURCES_SERVICE_URL=http://sources:3003
      - MEDIA_LOAD_SERVICE_URL=http://media-load:3004
      - SOURCES_DISABLE_VPN_CHECK=true
      - TMDB_API_URL=http://tmdb-mock/3
      - TMDB_API_ACCESS_TOKEN=${TMDB_API_ACCESS_TOKEN:-e2e-dummy-token}
      - TRAKT_API_URL=http://trakt-mock
      - TRAKT_CLIENT_ID=${E2E_TRAKT_CLIENT_ID-${TRAKT_CLIENT_ID:-mock-trakt-client-id}}
      - TRAKT_CLIENT_SECRET=${E2E_TRAKT_CLIENT_SECRET-${TRAKT_CLIENT_SECRET:-mock-trakt-client-secret}}
      - TRAKT_REDIRECT_URI=${E2E_TRAKT_REDIRECT_URI-${TRAKT_REDIRECT_URI:-https://app.example/trakt/callback}}
      - CARDIGANN_DEFINITION_SOURCES=http://indexer-mock/definitions
      - DISABLE_VPN_CHECK=true
      - DISABLE_DISCOVERY=true
      - STATIC_TRACKERS=udp://tracker-mock:6969/announce
      - SCRAPE_TRACKERS=udp://tracker-mock:6969/announce
      - BEST_TRACKERS_DOWNLOAD_URL=http://tracker-mock:8080/trackers_best.txt
      - BLACKLISTED_TRACKERS_DOWNLOAD_URL=http://tracker-mock:8080/blacklist.txt
      - DOWNLOAD_PATH=/usr/src/app/downloads
      - ENABLE_TRACING=true
      - DEBUG=*,-require-in-the-middle
      - DISABLE_BACKGROUND_TASKS=true
      - FRONTEND_DIR=/usr/src/app/public
    networks:
      - test-network
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Mount the backend source code for hot reloading
      - ../../backend/src:/usr/src/app/backend/src:ro
      - ../../backend/package.json:/usr/src/app/backend/package.json:ro
      - ../../backend/tsconfig.json:/usr/src/app/backend/tsconfig.json:ro
      # Fresh database for each development session
      - dev_database:/usr/src/app/data
      - ../../traces:/tmp:rw
      # Mount built frontend to be served as static assets
      - ../../dist/frontend:/usr/src/app/public:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      bunqueue:
        condition: service_started
      media-catalog:
        condition: service_healthy
      tmdb-mock:
        condition: service_healthy
      indexer-mock:
        condition: service_healthy
      trakt-mock:
        condition: service_healthy
      list-service:
        condition: service_healthy
      sources:
        condition: service_healthy
      media-load:
        condition: service_healthy
      tracker-mock:
        condition: service_healthy

  # The torrent engine and tracker scrapes; the tracker settings above reach it through the
  # backend's configuration push.
  media-load:
    build:
      context: ../../
      dockerfile: services/media-load/Dockerfile
      target: development
    environment:
      - MEDIA_LOAD_PORT=3004
      - MEDIA_LOAD_DATA_DIR=/app/data
    volumes:
      - ../../services/media-load/src:/workspace/services/media-load/src
      - dev_media_load_data:/app/data
      - dev_downloads:/usr/src/app/downloads
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3004/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  sources:
    build:
      context: ../../
      dockerfile: services/sources/Dockerfile
      target: development
    environment:
      - SOURCES_PORT=3003
      - SOURCES_DATA_DIR=/app/data
      - SOURCES_PRELOAD_PROVIDERS=imdb-title@http://indexer-mock/definitions movies-api@http://indexer-mock/definitions
      - SOURCES_ANIME_LISTS_URL=http://anime-lists-mock/Fribb/anime-lists/master/anime-list-full.json
      - SOURCES_ANI_ZIP_URL=http://anizip-mock/mappings
    volumes:
      - ../../services/sources/src:/workspace/services/sources/src
      - sources_data:/app/data
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3003/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      indexer-mock:
        condition: service_healthy
      anizip-mock:
        condition: service_healthy
      anime-lists-mock:
        condition: service_healthy

  # Media catalog service (fronts the TMDB mock)
  list-service:
    build:
      context: ../../
      dockerfile: services/list-service/Dockerfile
      target: development
    environment:
      - LIST_SERVICE_PORT=3002
      - LIST_SERVICE_DATA_DIR=/app/data
      - ANILIST_API_URL=http://anilist-mock/
      - ANIME_LISTS_URL=http://anime-lists-mock/Fribb/anime-lists/master/anime-list-full.json
    volumes:
      - ../../services/list-service/src:/workspace/services/list-service/src
      - list_service_data:/app/data
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3002/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      trakt-mock:
        condition: service_healthy
      anilist-mock:
        condition: service_healthy
      anime-lists-mock:
        condition: service_healthy

  media-catalog:
    build:
      context: ../../
      dockerfile: services/media-catalog/Dockerfile
      target: development
    environment:
      - CATALOG_DATA_DIR=/app/data
      - CATALOG_ANIME_LISTS_URL=http://anime-lists-mock/Fribb/anime-lists/master/anime-list-full.json
      - CATALOG_ANI_ZIP_URL=http://anizip-mock/mappings
      - CATALOG_DISABLE_BACKGROUND_TASKS=true
      - DEBUG=*,-require-in-the-middle
    volumes:
      # Hot reload of the catalog service sources
      - ../../services/media-catalog/src:/workspace/services/media-catalog/src
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      tmdb-mock:
        condition: service_healthy
      anizip-mock:
        condition: service_healthy
      anime-lists-mock:
        condition: service_healthy

  # TMDB Image Mock Service
  tmdb-images:
    build:
      context: mock
      dockerfile: tmdb-images.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - ASSET_DIR=/app/data/images
      - IMAGE_PROXY_BASE_URL=https://image.tmdb.org/t/p/
    ports:
      - '${TMDB_IMAGE_PORT:-3001}:80'
    volumes:
      - ../../test-fixtures/providers/tmdb:/app/data:ro
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 5s

  # TMDB API Mock Service
  tmdb-mock:
    build:
      context: mock
      dockerfile: tmdb.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.themoviedb.org/3
      - API_AUTH_HEADER_IS_BEARER=true
      - API_KEY=${TMDB_API_ACCESS_TOKEN:-e2e-dummy-token}
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - IMAGE_BASE_URL=http://127.0.0.1:${TMDB_IMAGE_PORT:-3001}/t/p/
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/tmdb:/app/data
    networks:
      - test-network
    depends_on:
      tmdb-images:
        condition: service_healthy

  # Trakt Mock Service
  trakt-mock:
    build:
      context: mock
      dockerfile: trakt.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.trakt.tv
      - API_AUTH_HEADER=trakt-api-key
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=$TRAKT_CLIENT_ID
      - API_SECRET=$TRAKT_CLIENT_SECRET
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - |
        API_HEADERS={"trakt-api-version": "2"}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/trakt:/app/data
    networks:
      - test-network

  # Anime: AniList rankings (GraphQL, recorded by request body), ani.zip episode mappings and
  # Fribb's AniList/AniDB → TMDB list (trimmed to what the tests use).
  anilist-mock:
    build:
      context: mock
      dockerfile: mock.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://graphql.anilist.co
      # Public API: no key, but the mock always sends one header.
      - API_AUTH_HEADER=x-miauflix-mock
      - API_KEY=none
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - KEY_POST_BY_BODY=true
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/anilist:/app/data
    networks:
      - test-network

  anizip-mock:
    build:
      context: mock
      dockerfile: mock.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.ani.zip
      # Public API: no key, but the mock always sends one header.
      - API_AUTH_HEADER=x-miauflix-mock
      - API_KEY=none
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/anizip:/app/data
    networks:
      - test-network

  anime-lists-mock:
    build:
      context: mock
      dockerfile: mock.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://raw.githubusercontent.com
      # Public API: no key, but the mock always sends one header.
      - API_AUTH_HEADER=x-miauflix-mock
      - API_KEY=none
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/anime-lists:/app/data
    networks:
      - test-network

  # Indexer mock: fictional release data plus the Cardigann definitions that query it
  indexer-mock:
    image: miauflix-e2e-indexer-mock:${E2E_IMAGE_TAG:-local}
    build:
      context: mock
      dockerfile: tmdb.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - DEFINITIONS_DIR=/app/definitions
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./indexer/data:/app/data
      - ./indexer/definitions:/app/definitions:ro
    networks:
      - test-network

  # Local HTTP tracker lists and UDP scrape responses keep torrent setup offline.
  tracker-mock:
    image: node:22-alpine
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: ['node', '/app/index.js']
    volumes:
      - ./mock/tracker/index.js:/app/index.js:ro
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  test-network:
    driver: bridge

volumes:
  dev_bunqueue_data:
    name: miauflix_dev_bunqueue_data
  dev_database:
    name: miauflix_dev_database
  dev_downloads:
    name: miauflix_dev_downloads
  dev_media_load_data:
    name: miauflix_dev_media_load_data
  list_service_data:
    name: miauflix_dev_list_service_data
  sources_data:
    name: miauflix_dev_sources_data
