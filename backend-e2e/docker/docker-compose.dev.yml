services:
  # Bunqueue broker for backend schedule coordination and background jobs
  bunqueue:
    image: ghcr.io/egeominotti/bunqueue:2.8.61
    volumes:
      - dev_bunqueue_data:/app/data
    networks:
      - test-network

  # Backend service with hot reloading for development
  backend:
    build:
      context: ../../
      dockerfile: backend-e2e/docker/backend.dev.Dockerfile
    environment:
      - PUID=${USER_ID:-1001}
      - PGID=${GROUP_ID:-1001}
      - PORT=3000
      - NODE_ENV=development
      - RATE_LIMIT_TEST_MODE=true
      - ALLOW_CREATE_ADMIN_ON_FIRST_RUN=${ALLOW_CREATE_ADMIN_ON_FIRST_RUN:-false}
      - BUNQUEUE_HOST=bunqueue
      - BUNQUEUE_PORT=6789
      - CATALOG_SERVICE_URL=http://media-catalog:3001
      - LIST_SERVICE_URL=http://list-service:3002
      - TMDB_API_URL=http://tmdb-mock/3
      - TMDB_API_ACCESS_TOKEN=${TMDB_API_ACCESS_TOKEN:-e2e-dummy-token}
      - TRAKT_API_URL=http://trakt-mock
      - TRAKT_CLIENT_ID=${E2E_TRAKT_CLIENT_ID-${TRAKT_CLIENT_ID:-mock-trakt-client-id}}
      - TRAKT_CLIENT_SECRET=${E2E_TRAKT_CLIENT_SECRET-${TRAKT_CLIENT_SECRET:-mock-trakt-client-secret}}
      - TRAKT_REDIRECT_URI=${E2E_TRAKT_REDIRECT_URI-${TRAKT_REDIRECT_URI:-https://app.example/trakt/callback}}
      - YTS_API_URL=http://yts-mock
      - THE_RARBG_API_URL=http://therarbg-mock
      - DISABLE_VPN_CHECK=true
      - DISABLE_DISCOVERY=true
      - STATIC_TRACKERS=udp://tracker-mock:6969/announce
      - SCRAPE_TRACKERS=udp://tracker-mock:6969/announce
      - BEST_TRACKERS_DOWNLOAD_URL=http://tracker-mock:8080/trackers_best.txt
      - BLACKLISTED_TRACKERS_DOWNLOAD_URL=http://tracker-mock:8080/blacklist.txt
      - DOWNLOAD_PATH=/usr/src/app/downloads
      - ENABLE_TRACING=true
      - DEBUG=*,-require-in-the-middle
      - DISABLE_BACKGROUND_TASKS=true
      - FRONTEND_DIR=/usr/src/app/public
    networks:
      - test-network
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      # Mount the backend source code for hot reloading
      - ../../backend/src:/usr/src/app/backend/src:ro
      - ../../backend/package.json:/usr/src/app/backend/package.json:ro
      - ../../backend/tsconfig.json:/usr/src/app/backend/tsconfig.json:ro
      # Fresh database for each development session
      - dev_database:/usr/src/app/data
      - dev_downloads:/usr/src/app/downloads
      - ../../traces:/tmp:rw
      # Mount built frontend to be served as static assets
      - ../../dist/frontend:/usr/src/app/public:ro
    healthcheck:
      test: ['CMD', 'curl', '-f', '-s', '-o', '/dev/null', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      bunqueue:
        condition: service_started
      media-catalog:
        condition: service_healthy
      tmdb-mock:
        condition: service_healthy
      yts-mock:
        condition: service_healthy
      trakt-mock:
        condition: service_healthy
      list-service:
        condition: service_healthy
      therarbg-mock:
        condition: service_healthy
      tracker-mock:
        condition: service_healthy

  # Media catalog service (fronts the TMDB mock)
  list-service:
    build:
      context: ../../
      dockerfile: services/list-service/Dockerfile
      target: development
    environment:
      - LIST_SERVICE_PORT=3002
      - LIST_SERVICE_DATA_DIR=/app/data
    volumes:
      - ../../services/list-service/src:/workspace/services/list-service/src
      - list_service_data:/app/data
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3002/health').then(r => { if (!r.ok) process.exit(1) })",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      trakt-mock:
        condition: service_healthy

  media-catalog:
    build:
      context: ../../
      dockerfile: services/media-catalog/Dockerfile
      target: development
    environment:
      - CATALOG_DATA_DIR=/app/data
      - CATALOG_DISABLE_BACKGROUND_TASKS=true
      - DEBUG=*,-require-in-the-middle
    volumes:
      # Hot reload of the catalog service sources
      - ../../services/media-catalog/src:/workspace/services/media-catalog/src
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    depends_on:
      tmdb-mock:
        condition: service_healthy

  # TMDB Image Mock Service
  tmdb-images:
    build:
      context: mock
      dockerfile: tmdb-images.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - ASSET_DIR=/app/data/images
      - IMAGE_PROXY_BASE_URL=https://image.tmdb.org/t/p/
    ports:
      - '${TMDB_IMAGE_PORT:-3001}:80'
    volumes:
      - ../../test-fixtures/providers/tmdb:/app/data:ro
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 5s

  # TMDB API Mock Service
  tmdb-mock:
    build:
      context: mock
      dockerfile: tmdb.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.themoviedb.org/3
      - API_AUTH_HEADER_IS_BEARER=true
      - API_KEY=${TMDB_API_ACCESS_TOKEN:-e2e-dummy-token}
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - IMAGE_BASE_URL=http://127.0.0.1:${TMDB_IMAGE_PORT:-3001}/t/p/
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/tmdb:/app/data
    networks:
      - test-network
    depends_on:
      tmdb-images:
        condition: service_healthy

  # Trakt Mock Service
  trakt-mock:
    build:
      context: mock
      dockerfile: trakt.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://api.trakt.tv
      - API_AUTH_HEADER=trakt-api-key
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=$TRAKT_CLIENT_ID
      - API_SECRET=$TRAKT_CLIENT_SECRET
      - RECORD_PROVIDER_FIXTURES=${RECORD_PROVIDER_FIXTURES:-false}
      - |
        API_HEADERS={"trakt-api-version": "2"}
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ../../test-fixtures/providers/trakt:/app/data
    networks:
      - test-network

  # YTS Mock Service
  yts-mock:
    build:
      context: .
      dockerfile: mock/yts.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://yts.mx/api/v2
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=none
      - OWN_URL=http://yts-mock
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./yts/data:/app/data
    networks:
      - test-network

  # TheRARBG Mock Service
  therarbg-mock:
    build:
      context: .
      dockerfile: mock/therarbg.Dockerfile
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    environment:
      - DATA_DIR=/app/data
      - API_BASE_URL=https://therarbg.to
      - API_AUTH_HEADER_IS_BEARER=false
      - API_KEY=none
      - OWN_URL=http://therarbg-mock
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/health']
      interval: 0.5s
      timeout: 2s
      retries: 30
      start_period: 10s
    volumes:
      - ./therarbg/data:/app/data
    networks:
      - test-network

  # Local HTTP tracker lists and UDP scrape responses keep torrent setup offline.
  tracker-mock:
    image: node:22-alpine
    user: '${USER_ID:-1000}:${GROUP_ID:-1000}'
    command: ['node', '/app/index.js']
    volumes:
      - ./mock/tracker/index.js:/app/index.js:ro
    networks:
      - test-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:8080/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  test-network:
    driver: bridge

volumes:
  dev_bunqueue_data:
    name: miauflix_dev_bunqueue_data
  dev_database:
    name: miauflix_dev_database
  dev_downloads:
    name: miauflix_dev_downloads
  list_service_data:
    name: miauflix_dev_list_service_data
