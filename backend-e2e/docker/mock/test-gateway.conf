# Preserve the backend's raw HTTP behavior, including malformed-request tests,
# large cookies, WebSockets, streamed responses and byte ranges.
events {}
stream {
  server {
    listen 3000;
    proxy_pass backend:3000;
    proxy_connect_timeout 5s;
    proxy_timeout 120s;
  }
  server {
    listen 3001;
    proxy_pass tmdb-images:80;
    proxy_connect_timeout 5s;
    proxy_timeout 120s;
  }
}
