name: CI Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun (media-catalog service)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup test environment
        id: setup
        uses: ./.github/actions/setup-test-environment

      - name: Build packages
        run: npm run build

      - name: Check TypeScript
        run: npm run check:ts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test
        env:
          NODE_ENV: test
          # Force HTTP_VCR_MODE to replay mode only - no network requests
          HTTP_VCR_MODE: replay
          # Mock API keys - not real credentials needed
          TMDB_API_KEY: mock-api-key

      - name: Save Turbo cache
        if: steps.setup.outputs.turbo-cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ hashFiles('turbo.json', 'package-lock.json') }}-${{ github.sha }}

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-environment
        with:
          install-playwright: 'true'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare E2E host build context
        run: |
          date -u '+[E2E_PHASE] host-prerequisites-start %Y-%m-%dT%H:%M:%SZ'
          npm run build:backend
          bash backend-e2e/scripts/prepare-docker-build-context.sh
          date -u '+[E2E_PHASE] host-prerequisites-end %Y-%m-%dT%H:%M:%SZ'

      - name: Start E2E image build timing
        run: date -u '+[E2E_PHASE] image-cache-build-start %Y-%m-%dT%H:%M:%SZ'

      - name: Build E2E images with persistent layer cache
        uses: docker/bake-action@v6
        env:
          E2E_IMAGE_TAG: ${{ github.sha }}
        with:
          source: .
          workdir: backend-e2e/docker
          files: |
            docker-compose.test.yml
            docker-compose.test.ci.yml
          load: true

      - name: Finish E2E image build timing
        run: date -u '+[E2E_PHASE] image-cache-build-end %Y-%m-%dT%H:%M:%SZ'

      - name: Run E2E tests
        run: |
          date -u '+[E2E_PHASE] e2e-lanes-start %Y-%m-%dT%H:%M:%SZ'
          npm run test:e2e
          date -u '+[E2E_PHASE] e2e-lanes-end %Y-%m-%dT%H:%M:%SZ'
        env:
          NODE_ENV: test
          E2E_IMAGE_TAG: ${{ github.sha }}
          E2E_USE_PREBUILT_IMAGES: 'true'
          E2E_HOST_BUILD_PREPARED: 'true'
        # Includes service startup and all ordinary/Lighthouse browser lanes;
        # image build/import/export is measured in the preceding step.
        timeout-minutes: 15

      - name: Run list priority E2E with background workers
        run: npm run test:backend:e2e:background
        env:
          NODE_ENV: test
          E2E_IMAGE_TAG: ${{ github.sha }}
          E2E_USE_PREBUILT_IMAGES: 'true'
          E2E_HOST_BUILD_PREPARED: 'true'
        timeout-minutes: 10

      - name: Run initial-user setup E2E test
        run: |
          date -u '+[E2E_PHASE] initial-setup-start %Y-%m-%dT%H:%M:%SZ'
          npm run test:frontend:e2e:initial-setup
          date -u '+[E2E_PHASE] initial-setup-end %Y-%m-%dT%H:%M:%SZ'
        env:
          NODE_ENV: test
          E2E_IMAGE_TAG: ${{ github.sha }}
          E2E_USE_PREBUILT_IMAGES: 'true'
          E2E_HOST_BUILD_PREPARED: 'true'
        timeout-minutes: 10

      - name: Run details page preparation E2E test
        run: |
          date -u '+[E2E_PHASE] details-lane-start %Y-%m-%dT%H:%M:%SZ'
          npm run test:e2e:details --workspace frontend
          date -u '+[E2E_PHASE] details-lane-end %Y-%m-%dT%H:%M:%SZ'
        env:
          NODE_ENV: test
        timeout-minutes: 10

      - name: Run offline details voting E2E tests
        run: |
          date -u '+[E2E_PHASE] details-voting-lane-start %Y-%m-%dT%H:%M:%SZ'
          npm run test:e2e:details-voting --workspace frontend
          date -u '+[E2E_PHASE] details-voting-lane-end %Y-%m-%dT%H:%M:%SZ'
        env:
          NODE_ENV: test
        timeout-minutes: 10

      - name: Upload E2E test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            backend-e2e/admin-credentials.json
            backend-e2e/logs/*.log
            backend-e2e/logs/traces/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/test-results-e2e/
            frontend/playwright-report-initial-setup/
            frontend/test-results-initial-setup/
            frontend/playwright-report-details/
            frontend/test-results-details/
            frontend/playwright-report-details-voting/
            frontend/test-results-details-voting/
            frontend/playwright-report-lighthouse/
            frontend/test-results-lighthouse/
            frontend/e2e/initial-user-setup.e2e.spec.ts-snapshots/
          if-no-files-found: ignore
          retention-days: 7

  visual-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-environment
        with:
          install-playwright: 'true'

      - name: Run visual tests
        run: npm run test:frontend:visual
        env:
          NODE_ENV: test
        timeout-minutes: 10

      - name: Upload visual test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-failures
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Publish multi-arch images to GHCR once every test job has passed. Each
  # architecture is built natively and pushed by digest, then merged into one
  # manifest list per image by publish-manifest.
  publish-build:
    if: github.event_name == 'push'
    needs: [test, e2e-tests, visual-tests]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [miauflix, miauflix-services, miauflix-media-catalog, miauflix-list-service]
        platform: [linux/amd64, linux/arm64]
        include:
          - image: miauflix
            file: Dockerfile
            target: ''
          - image: miauflix-services
            file: services/Dockerfile
            target: ''
          - image: miauflix-media-catalog
            file: services/media-catalog/Dockerfile
            target: production
          - image: miauflix-list-service
            file: services/list-service/Dockerfile
            target: production
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          # Shown in the app next to the version (only the miauflix image uses it).
          build-args: |
            MIAUFLIX_COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=publish-${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}-${{ matrix.image }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    needs: publish-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: miauflix
            description: Miauflix backend, serves the web frontend
          - image: miauflix-services
            description: Miauflix bunqueue, media catalog and list service in one container
          - image: miauflix-media-catalog
            description: Miauflix media catalog service
          - image: miauflix-list-service
            description: Miauflix list service

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"
