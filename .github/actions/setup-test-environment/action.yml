name: 'Setup Test Environment'
description: 'Common setup steps for test jobs: Node.js, Bun, dependencies, and Turbo cache. Optionally sets up Playwright browsers.'

inputs:
  install-playwright:
    description: 'Whether to install Playwright browsers'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    # Bun installs the dependencies (bun.lock) and runs the backend and services; its version
    # is the one in package.json's packageManager field, as in the Docker images.
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Restore node_modules cache
      id: node-modules-cache
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          */node_modules
          */*/node_modules
        key: ${{ runner.os }}-node22-bun-modules-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      if: steps.node-modules-cache.outputs.cache-hit != 'true'
      shell: bash
      # Install scripts that download from GitHub Releases (node-datachannel) can time out.
      run: |
        for attempt in 1 2 3; do
          bun install --frozen-lockfile && exit 0
          echo "bun install failed (attempt $attempt), retrying"
          sleep 20
        done
        exit 1

    # bun install runs workspace prepare scripts (e.g. a package's tsc); replay
    # them when node_modules came from the cache so their outputs still exist.
    - name: Run workspace prepare scripts
      if: steps.node-modules-cache.outputs.cache-hit == 'true'
      shell: bash
      run: npm run prepare --workspaces --if-present

    - name: Restore Turbo cache
      id: turbo-cache
      uses: actions/cache/restore@v4
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ hashFiles('turbo.json', 'bun.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ hashFiles('turbo.json', 'bun.lock') }}-
          ${{ runner.os }}-turbo-${{ github.ref_name }}-
          ${{ runner.os }}-turbo-

    - name: Install Playwright browsers
      if: inputs.install-playwright == 'true'
      shell: bash
      run: npx -w frontend playwright install --with-deps chromium

outputs:
  turbo-cache-hit:
    description: 'Whether Turbo cache was restored'
    value: ${{ steps.turbo-cache.outputs.cache-hit }}
